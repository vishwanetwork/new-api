name: Token Factory release

# Run by hand ("Run workflow", pick the branch): build the image from that
# branch, push it to ghcr.io/vishwanetwork/token-factory under the commit's
# full SHA, deploy it to the EKS cluster `vishwa` (namespace opennext, service
# token-factory) and check the result.
# Give a `tag` to redeploy or roll back to an image that already exists,
# without building.
# One-time setup (role binding, Secrets): deploy/k8s/rbac.yaml and the header
# of deploy/k8s/token-factory.yaml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Deploy this existing image (full commit SHA) instead of building
        required: false

permissions:
  contents: read

# One release at a time; a newer run replaces the one still running.
concurrency:
  group: token-factory-release
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/vishwanetwork/token-factory
  AWS_ROLE: arn:aws:iam::856805822428:role/vishwa-deploy
  AWS_REGION: us-west-2
  CLUSTER: vishwa

jobs:
  publish:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=token-factory
          cache-to: type=gha,mode=max,scope=token-factory

  deploy:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The manifests of the release being deployed (a rollback uses its own).
          ref: ${{ inputs.tag || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Cluster access
        run: aws eks update-kubeconfig --name "$CLUSTER"
      - name: Deploy
        run: bash deploy/k8s/scripts/deploy.sh "$TAG"
      - name: Check in the cluster
        run: bash deploy/k8s/scripts/verify.sh
      - name: Check the public name
        # Informational until DNS points ai.gateway.vishwalab.com at the ALB.
        continue-on-error: true
        run: bash deploy/k8s/scripts/verify.sh --public
