# Token Factory (this repository's gateway) on the EKS cluster `vishwa`,
# namespace `opennext`, served at https://gateway.opennextlab.ai.
#
# Applied by deploy/k8s/scripts/deploy.sh, which substitutes IMAGE_PLACEHOLDER.
# Needs two Secrets that are created once by hand and never stored in Git:
#   token-factory-database: SQL_DSN  (MySQL DSN, database `token-factory`)
#   token-factory-env:      SESSION_SECRET, CRYPTO_SECRET
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-factory
  namespace: opennext
  labels:
    app: token-factory
spec:
  # One replica: there is no Redis yet, and without it replicas do not share
  # their caches or rate-limit counters.
  replicas: 1
  selector:
    matchLabels:
      app: token-factory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: token-factory
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Let streaming responses finish before the pod is removed.
      terminationGracePeriodSeconds: 120
      containers:
        - name: token-factory
          image: IMAGE_PLACEHOLDER
          args: ['--log-dir', '/data/logs']
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: token-factory-database
                  key: SQL_DSN
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: token-factory-env
                  key: SESSION_SECRET
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: token-factory-env
                  key: CRYPTO_SECRET
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TZ
              value: UTC
            - name: ERROR_LOG_ENABLED
              value: 'true'
            - name: BATCH_UPDATE_ENABLED
              value: 'true'
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            # First start also runs the schema migration.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Logs and scratch only; all state is in MySQL.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: token-factory
  namespace: opennext
  labels:
    app: token-factory
spec:
  selector:
    app: token-factory
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: token-factory
  namespace: opennext
  annotations:
    # Joins the shared internet-facing ALB used by the other services.
    alb.ingress.kubernetes.io/group.name: public-alb
    alb.ingress.kubernetes.io/load-balancer-name: public-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/subnets: subnet-04aa69b4b40e3c1e5,subnet-016fb5eb25bfa1239
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # ACM wildcard certificate for *.opennextlab.ai.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:856805822428:certificate/9c942963-cd94-4d12-b9bb-2a98b3163271
    alb.ingress.kubernetes.io/healthcheck-path: /api/status
spec:
  ingressClassName: alb
  rules:
    - host: gateway.opennextlab.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: token-factory
                port:
                  name: http
